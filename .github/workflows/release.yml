name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build .app (Apple Silicon)
        # Sparkle EdDSA 私钥在仓库 Secret 中时，可在此生成 appcast（见 README「发布」章节）
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToggleDock
          path: build/ToggleDock.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/ToggleDock.zip
          generate_release_notes: true
